<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Board Game Catalog</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <nav class="site-nav" aria-label="Site navigation">
      <span></span>
      <a class="nav-link" href="admin.html">Admin</a>
    </nav>
    <main class="shell">
      <section class="toolbar" aria-label="Board game filters">
        <div>
          <p class="eyebrow">Local catalog</p>
          <h1>Board Game Finder</h1>
          <nav class="page-links" aria-label="Catalog pages">
            <a class="button-link" href="randomizer.html">Randomizer</a>
          </nav>
        </div>
        <form id="filters" class="filters">
          <label>
            Players
            <input id="players" name="players" type="hidden">
            <div class="filter-combo" data-filter-combo="players">
              <button type="button" class="combo-toggle" aria-expanded="false">Any count</button>
              <input class="combo-search" type="search" placeholder="Type to narrow counts" autocomplete="off" hidden>
              <div class="combo-panel" hidden>
                <div class="combo-options"></div>
              </div>
            </div>
          </label>
          <label>
            Genre
            <input id="genre" name="genre" type="hidden">
            <div class="filter-combo" data-filter-combo="genre">
              <button type="button" class="combo-toggle" aria-expanded="false">Any genre</button>
              <input class="combo-search" type="search" placeholder="Type to narrow genres" autocomplete="off" hidden>
              <div class="combo-panel" hidden>
                <div class="combo-options"></div>
              </div>
            </div>
          </label>
          <label>
            Complexity
            <input id="maxComplexity" name="maxComplexity" type="hidden">
            <div class="filter-combo" data-filter-combo="maxComplexity">
              <button type="button" class="combo-toggle" aria-expanded="false">Any weight</button>
              <input class="combo-search" type="search" placeholder="Type to narrow weights" autocomplete="off" hidden>
              <div class="combo-panel" hidden>
                <div class="combo-options"></div>
              </div>
            </div>
          </label>
          <button type="submit">Find games</button>
          <button type="button" id="reset">Reset</button>
        </form>
      </section>

      <section class="summary" aria-live="polite">
        <strong id="resultCount">0 games</strong>
        <span id="activeFilters">Showing the full catalog.</span>
      </section>

      <section class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Players</th>
              <th>Genre</th>
              <th>Complexity</th>
              <th>Source</th>
            </tr>
          </thead>
          <tbody id="games"></tbody>
        </table>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
