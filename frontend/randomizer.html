<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Board Game Randomizer</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <nav class="site-nav" aria-label="Site navigation">
      <a class="nav-link" href="index.html">Finder</a>
      <a class="nav-link" href="admin.html">Admin</a>
    </nav>
    <main class="shell randomizer-shell">
      <section class="randomizer-header" aria-label="Board game randomizer">
        <div>
          <p class="eyebrow">Game night picker</p>
          <h1>Randomizer</h1>
        </div>
      </section>

      <section class="randomizer-filter-panel" aria-label="Randomizer filters">
        <form id="randomizerFilters" class="randomizer-controls">
          <label>
            Player count up to
            <input id="playerLimit" name="playerLimit" type="hidden">
            <div class="filter-combo" data-filter-combo="playerLimit">
              <button type="button" class="combo-toggle" aria-expanded="false">Any count</button>
              <input class="combo-search" type="search" placeholder="Type to narrow counts" autocomplete="off" hidden>
              <div class="combo-panel" hidden>
                <div class="combo-options"></div>
              </div>
            </div>
          </label>
          <div class="filter-field genre-filter">
            <span class="filter-label">Genres</span>
            <div class="filter-combo" data-filter-combo="genres" data-multi="true">
              <button type="button" class="combo-toggle" id="genreSummary" aria-expanded="false">Any genre</button>
              <input class="combo-search" type="search" placeholder="Type to narrow genres" autocomplete="off" hidden>
              <div class="combo-panel" hidden>
                <div id="genreOptions" class="combo-options"></div>
              </div>
            </div>
          </div>
          <label>
            Complexity
            <input id="complexityRange" name="complexityRange" type="hidden">
            <div class="filter-combo" data-filter-combo="complexityRange">
              <button type="button" class="combo-toggle" aria-expanded="false">Any complexity</button>
              <input class="combo-search" type="search" placeholder="Type to narrow complexity" autocomplete="off" hidden>
              <div class="combo-panel" hidden>
                <div class="combo-options"></div>
              </div>
            </div>
          </label>
          <button type="button" id="randomize">Randomize</button>
          <button type="button" id="clearRandomizer">Reset</button>
        </form>
      </section>

      <section class="slot-machine" aria-live="polite">
        <div class="slot-cabinet">
          <div class="slot-marquee">
            <span>Game Night Picker</span>
          </div>
          <div class="slot-body">
            <div class="slot-window">
              <div class="slot-reel" id="slotReel">
                <div class="slot-item">Ready to spin</div>
              </div>
            </div>
            <button type="button" class="slot-handle" id="randomizeHandle" aria-label="Pull the randomizer handle">
              <span class="handle-knob"></span>
              <span class="handle-stem"></span>
            </button>
          </div>
        </div>
        <div class="winner-card" id="winnerCard" hidden>
          <p class="eyebrow">Tonight's pick</p>
          <h2 id="winnerName"></h2>
          <dl>
            <div>
              <dt>Players</dt>
              <dd id="winnerPlayers"></dd>
            </div>
            <div>
              <dt>Genres</dt>
              <dd id="winnerGenres"></dd>
            </div>
            <div>
              <dt>Complexity</dt>
              <dd id="winnerComplexity"></dd>
            </div>
          </dl>
          <a id="winnerSource" href="#" target="_blank" rel="noreferrer" hidden>Open on BGG</a>
        </div>
      </section>

      <section class="summary" aria-live="polite">
        <strong id="candidateCount">0 games</strong>
        <span id="randomizerStatus">Loading your catalog.</span>
      </section>
    </main>

    <script src="randomizer.js"></script>
  </body>
</html>
